# Issue + PR labels managed by gitea-label-sync.
# Applied to this repo via `just labels-sync`.
- name: bug
  color: '#d73a4a'
  description: Something is broken
- name: enhancement
  color: '#a2eeef'
  description: New feature or capability
- name: documentation
  color: '#0075ca'
  description: Docs change
- name: chore
  color: '#fef2c0'
  description: Routine maintenance, no behavior change
- name: dependencies
  color: '#0366d6'
  description: Dependency bump (renovate-tagged)
- name: needs-review
  color: '#fbca04'
  description: Awaiting reviewer
- name: do-not-merge
  color: '#b60205'
  description: Blocked from merge
- name: breaking-change
  color: '#b60205'
  description: Backwards-incompatible change

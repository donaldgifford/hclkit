# goreleaser config for hclkit
# Triggered by .forgejo/workflows/release.yml or .github/workflows/release.yml on tag push.
version: 2

project_name: hclkit

before:
  hooks:
    - go mod tidy

builds:
  - id: hclkit
    main: ./cmd/hclkit
    binary: hclkit
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]

checksum:
  name_template: 'checksums.txt'

changelog:
  use: git-cliff

release:
  draft: false
  # TODO: when running against Forgejo, set GITEA_TOKEN in CI and uncomment:
  # gitea_urls:
  #   api: https://github.com/api/v1/
  #   download: https://github.com
